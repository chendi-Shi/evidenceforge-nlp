[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceforge"
version = "0.2.0"
description = "CPU neural retrieval adaptation, false-negative risk filtering and reproducible evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "numpy>=2.1,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5", "onnxruntime>=1.20,<2", "tokenizers>=0.21,<1",
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
adaptation = ["torch>=2.6,<2.9", "transformers>=4.57,<5", "safetensors>=0.4,<1"]
distillation = ["torch>=2.6,<2.9", "transformers>=4.57,<5", "safetensors>=0.4,<1", "pyarrow>=18,<27"]

[project.scripts]
evidenceforge = "evidenceforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
