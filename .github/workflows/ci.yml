name: offline-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
  neural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev,distillation]'
      - run: pytest -q tests/test_adaptation.py tests/test_neural_experiment.py tests/test_distill_data.py tests/test_distill_student.py tests/test_distill_eval.py tests/test_distill_experiment.py
